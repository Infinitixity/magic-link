plugins {
    id 'com.android.application'
}

android {
    namespace 'com.infinitixity.magiclinkadmin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.infinitixity.magiclinkadmin'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
