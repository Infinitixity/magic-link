plugins {
    id 'com.android.application'
}

android {
    namespace 'com.infinitixity.magiclink'
    compileSdk 35

    defaultConfig {
        applicationId 'com.infinitixity.magiclink'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
    }
}
